name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Prevent two concurrent pushes from publishing an older APK on top of a newer one.
concurrency:
  group: weread-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - name: Upload debug build for internal diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: weread-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Sign release APK using GitHub Secrets
        id: release_signing
        env:
          KEYSTORE_B64: ${{ secrets.WEREAD_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WEREAD_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "No signing secrets configured. Build/test succeeded; release upload skipped."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/weread-release.p12"
          WEREAD_SIGNING_PATH="$RUNNER_TEMP/weread-release.p12" \
          WEREAD_SIGNING_PASSWORD="$SIGNING_PASSWORD" \
            gradle --no-daemon --stacktrace assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk weread-release.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.release_signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weread-release-signed-apk
          path: weread-release.apk
          if-no-files-found: error
      - name: Publish signed APK to preview Release
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 ||
            gh release create preview --title "WeRead 预览版" --prerelease --target main --notes "由 GitHub Actions Secrets 中固定证书签名的安装包"
          gh release upload preview weread-release.apk --clobber
          gh release delete-asset preview app-debug.apk --yes || true
      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: weread-release.apk
          prerelease: true
