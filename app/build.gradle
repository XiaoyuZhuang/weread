plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xiaoyu.weread'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiaoyu.weread'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.6.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    signingConfigs {
        fixedRelease {
            def keyPath = System.getenv("WEREAD_SIGNING_PATH")
            def password = System.getenv("WEREAD_SIGNING_PASSWORD")
            if (keyPath && password) {
                storeFile file(keyPath)
                storePassword password
                keyAlias 'weread-release'
                keyPassword password
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("WEREAD_SIGNING_PATH") && System.getenv("WEREAD_SIGNING_PASSWORD")) {
                signingConfig signingConfigs.fixedRelease
            }
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
