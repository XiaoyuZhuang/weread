name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Prevent two concurrent pushes from publishing an older APK on top of a newer one.
concurrency:
  group: weread-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest
      - name: Upload debug build for internal diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: weread-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Sign release APK using GitHub Secrets
        id: release_signing
        env:
          KEYSTORE_B64: ${{ secrets.WEREAD_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WEREAD_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "No signing secrets configured. Build/test succeeded; release upload skipped."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/weread-release.p12"
          WEREAD_SIGNING_PATH="$RUNNER_TEMP/weread-release.p12" \
          WEREAD_SIGNING_PASSWORD="$SIGNING_PASSWORD" \
            gradle --no-daemon --stacktrace assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk weread-release.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.release_signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weread-release-signed-apk
          path: weread-release.apk
          if-no-files-found: error
      - name: Publish official versioned Release
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use the real Android version and a normal, non-prerelease GitHub Release.
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | tr -d "'" | awk '{print $2}')
          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine Android versionName" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" weread-release.apk --clobber
            gh release edit "$TAG" --title "WeRead $TAG" --prerelease=false --latest
          else
            gh release create "$TAG" weread-release.apk \
              --title "WeRead $TAG" \
              --target "$GITHUB_SHA" \
              --notes "正式版：固定签名 Android APK，可覆盖安装之前的固定签名版本。源代码位于 main 分支。" \
              --latest
          fi
          echo "Official Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
      - name: Remove obsolete preview Release
        if: github.ref == 'refs/heads/main' && steps.release_signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only remove the old preview after the versioned official Release succeeds.
          gh release delete preview --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" 2>/dev/null || true
